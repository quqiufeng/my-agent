<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>每日简报</title>
<link rel="stylesheet" href="kami.css">
</head>
<body>
<div class="page">

  <div class="head">
    <div>
      <div class="eyebrow">DAILY BRIEF · 每日简报</div>
      <h1>日期占位 · 一句话主题</h1>
    </div>
    <div class="meta">2026-10-12 · 星期日</div>
  </div>
  <hr class="hairline">

  <p class="lede">用一两句概述今天最重要的结论；读者只看这段也能拿到要点。</p>

  <h2>关键指标</h2>
  <div class="metrics">
    <div class="metric"><div class="v">0</div><div class="l">指标一</div></div>
    <div class="metric"><div class="v">0</div><div class="l">指标二</div></div>
    <div class="metric"><div class="v">0%</div><div class="l">指标三</div></div>
  </div>

  <h2>今日要点</h2>
  <ul>
    <li><strong>要点一：</strong>一句具体、可核查的说明。</li>
    <li><strong>要点二：</strong>一句具体、可核查的说明。</li>
    <li><strong>要点三：</strong>一句具体、可核查的说明。</li>
  </ul>

  <h2>数据</h2>
  <table>
    <thead><tr><th>项目</th><th class="num">数值</th><th class="num">变化</th></tr></thead>
    <tbody>
      <tr><td>示例项 A</td><td class="num">123</td><td class="num">+4.2%</td></tr>
      <tr><td>示例项 B</td><td class="num">456</td><td class="num">-1.0%</td></tr>
    </tbody>
  </table>

  <h2>备注</h2>
  <div class="card">
    <p class="muted" style="margin:0">需要强调的一段说明放这里。<span class="tag">标签</span></p>
  </div>

  <div class="footer">
    <span>my-agent · 每日简报</span>
    <span>kami.tw93.fun</span>
  </div>

</div>
</body>
</html>
